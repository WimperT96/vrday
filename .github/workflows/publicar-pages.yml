# Publica el sitio en GitHub Pages en cada push a main (o a mano: Actions → Run workflow).
#
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# El modo se decide solo, según lo configurado en Settings → Pages (salida de configure-pages):
#   - Sin dominio propio → VISTA PREVIA en https://<usuario>.github.io/<repositorio>/
#       subcarpeta /<repositorio>/ (VR_BASE_URL), no indexable (VR_NOINDEX) y con las marcas
#       de "Contenido provisional" (--borrador) para que el equipo vea qué falta.
#   - Con dominio propio (Custom domain = vrdaylatam.org) → PRODUCCIÓN en la raíz del dominio,
#       indexable por buscadores y sin marcas de contenido provisional.
# Pasos para conectar el dominio: docs/12-dominio-propio.md
name: Publicar sitio (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python manage.py test sitio

      - id: pages
        uses: actions/configure-pages@v6

      - name: Elegir modo (vista previa o producción)
        run: |
          host="${{ steps.pages.outputs.host }}"
          if [[ -z "$host" || "$host" == *.github.io ]]; then
            echo "Vista previa: ${{ steps.pages.outputs.base_url }}"
            echo "VR_BASE_URL=${{ steps.pages.outputs.base_path }}" >> "$GITHUB_ENV"
            echo "VR_NOINDEX=1" >> "$GITHUB_ENV"
            echo "OPCIONES_EXPORTAR=--borrador" >> "$GITHUB_ENV"
          else
            echo "Producción: ${{ steps.pages.outputs.base_url }}"
          fi

      - name: Exportar sitio estático
        run: python manage.py exportar $OPCIONES_EXPORTAR

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
