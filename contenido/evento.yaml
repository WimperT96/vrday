    texto: Expertos en tecnología, educación y salud.
    icono: visor-vr        # íconos lineales (Lucide u otro set)
  - titulo: Exhibición de soluciones
    texto: Hardware, software y experiencias inmersivas.
    icono: cubo
  - titulo: Networking
    texto: Conecta con profesionales y empresas del sector.
    icono: usuarios
  - titulo: Talleres prácticos
    texto: Aprende, crea y vive la realidad virtual.
    icono: bombilla

