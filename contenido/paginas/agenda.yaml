# ============================================================================
# PÁGINA: AGENDA — VR Day LATAM 2026
# URL: /agenda/
# Fuente: "Invitación a delegados institucionales" (PDF, oct-2026), sección "Agenda del evento".
# Reemplaza a la agenda tentativa (referencias/evento-2026/agenda-tentativa-2026.jpg).
# La agenda 2023 (6 países) está en paginas/memorias/2023-agenda.yaml.
#
# Estructura: sedes -> días -> sesiones. Hoy solo existe la sede Ecuador;
# para otra sede (otro país) se agrega otro bloque en "sedes".
# Los nombres de "actividad" se usan en inicio.yaml -> agenda_resumen.destacar.
# ============================================================================

slug: agenda
url: /agenda/
titulo: Agenda
estado: publicada
url_original: https://vrdaylatam.org/agenda/
edicion: 2026

secciones:
  - tipo: cabecera
    titulo: Agenda – VRDay LATAM 2026
    subtitulo: 12 y 13 de noviembre de 2026

  - tipo: agenda_dias
    id: programa
    tentativa: false                 # true = muestra la etiqueta "Agenda tentativa"
    sedes:
      - id: ecuador
        nombre: "Sede Ecuador: Universidad Técnica Particular de Loja – UTPL"
        pais: Ecuador
        bandera: banderas/ecuador.png
        dias:
          - id: jueves-12
            fecha: 2026-11-12
            etiqueta: Jueves 12 de noviembre
            sesiones:
              - hora: "08:30 – 11:00"
                actividad: Asamblea General RAIN Ecuador
                detalle: Presencial y obligatoria para los delegados de las universidades miembros de RAIN Ecuador.
              - hora: "11:30 – 12:30"
                actividad: Recorrido institucional
                detalle: Visita a las instalaciones y espacios tecnológicos de la UTPL.
              - hora: "14:00 – 19:00"
                actividad: Bootcamp de cocreación con tecnologías inmersivas
                detalle: Cupos limitados, con inscripción previa.
          - id: viernes-13
            fecha: 2026-11-13
            etiqueta: Viernes 13 de noviembre
            sesiones:
              - hora: "09:00 – 09:45"
                actividad: Conferencia magistral internacional
                detalle: A cargo de Vincent Moulinet, artista francés de medios en tiempo real, curador y diseñador de videojuegos, gracias al apoyo de la Embajada de Francia en Ecuador.
                destacada: true
              - hora: "10:00 – 13:30"
                actividad: VRDay Talks y stands
                detalle: Presentaciones en dos categorías, docentes y estudiantes, y stands de demostración de las universidades.
              - hora: "15:00 – 16:00"
                actividad: Premiación y foto oficial
                detalle: Reconocimiento a las 3 mejores experiencias, con placa.
                destacada: true
              - hora: "16:30"
                actividad: Circuito FIAV UTPL
                detalle: ""
            nota: Los stands estarán ubicados en el Centro de Convenciones UTPL.   # solo en este día
        # nota: ...   (nota de la sede: se muestra bajo las pestañas, en todos los días)

  - tipo: botones
    items:
      - texto: Ver el lugar del evento
        url: /lugar/
      - texto: Agenda 2023
        url: /memorias/2023/agenda/
