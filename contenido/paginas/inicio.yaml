# ============================================================================
# PÁGINA: INICIO — VR Day LATAM 2026
# URL: /
# Basada en la maqueta referencias/identidad/mockup-web-inicio-2026.png.
# Fechas, lema, enlaces, características, sede y aliados se leen de contenido/evento.yaml:
# cambiar la edición = editar evento.yaml, no esta página.
# El Inicio anterior (edición 2023) está en paginas/memorias/2023.yaml.
# ============================================================================

slug: inicio
url: /
titulo: Inicio
estado: publicada
url_original: https://vrdaylatam.org/
seo:
  titulo: Virtual Reality Day LATAM 2026 – 12 y 13 de noviembre
  descripcion: >-
    Innovación, educación y experiencias inmersivas para un futuro sin límites.
    VR Day LATAM 2026, 12 y 13 de noviembre en la Universidad Técnica Particular de Loja (UTPL).

secciones:

  # 1 ── Hero (maqueta: fecha, logo apilado, lema, 2 botones, foto con HUD)
  - tipo: hero_evento
    id: portada
    fuente: evento                         # toma fechas, lema e inscripción de evento.yaml
    logo: marca/logo-vrday-2026-apilado.svg   # PLACEHOLDER hasta tener el SVG
    usar_logo_imagen: false                # false = logotipo compuesto con texto y CSS; true cuando llegue el SVG
    # Video vertical (YouTube Short) en lugar de la foto; se reproduce al hacer clic.
    # Sin `video`, se usa `imagen` (+ `alt`).
    video: 6tjNK5AoqAI                     # https://www.youtube.com/shorts/6tjNK5AoqAI
    video_titulo: Virtual Reality Day Latam 2026
    video_portada: inicio-2026/hero-video-portada.webp   # primer fotograma del Short (1080×1920 → 540×960)
    video_automatico: true   # arranca solo al cargar y en bucle (no con movimiento reducido ni ahorro de datos)
    video_sonido: true       # intenta arrancar con volumen; si el navegador lo bloquea, arranca en silencio
                             # y el sonido se activa con el primer clic/toque/tecla (botón "Activar sonido")
    boton_secundario:
      texto: Ver agenda
      url: /agenda/
      icono: calendario
    efectos: {}                            # futuro: anillos HUD, circuitos, resplandor (docs/07)

  # 2 ── Las 4 características (tarjetas bajo el hero)
  - tipo: caracteristicas
    id: que-encontraras
    fuente: evento.caracteristicas

  # 3 ── Inscripción general (banner "Inscripciones abiertas" del .ai del diseñador)
  - tipo: inscripcion
    id: inscripcion
    fuente: evento                 # botón = evento.inscripcion (texto, url); logos = evento.organizadores
    titulo: Inscripciones **abiertas**
    imagen: inicio-2026/inscripcion-persona.webp
    alt: Persona con visor de realidad virtual interactuando con una interfaz
    # Mientras evento.inscripcion.url esté vacío, el botón aparece desactivado con este texto:
    texto_sin_enlace: Enlace disponible pronto

  # 4 ── Banda navy
  - tipo: banda
    id: conecta
    estilo: navy
    titulo: Un evento que **conecta**              # la palabra en ** ** va en azul (degradado)
    # Red de nodos a todo el ancho bajo el titular: hasta 4 palabras unidas al isotipo.
    # El subtítulo se quitó a propósito: las palabras las dicen los nodos.
    nodos:
      - {texto: ideas, icono: bombilla}
      - {texto: educación, icono: birrete}
      - {texto: tecnología, icono: cubo}
      - {texto: personas, icono: usuarios}
    efectos: {red_nodos: true}     # las líneas se dibujan al entrar en pantalla (docs/07)

  # 5 ── Convocatoria (afiche "Postulación de artículo")
  - tipo: convocatorias
    id: convocatoria
    fuente: evento.convocatorias
    # Si la fecha límite ya pasó, la plantilla oculta la convocatoria automáticamente.

  # 6 ── ¿Qué es el VRD? (texto institucional existente, sin cambios)
  - tipo: texto
    id: que-es
    titulo: ¿Qué es el Virtual Reality Day?
    cuerpo: |
      El Virtual Reality Day (VRD) o Día de la Realidad Virtual es un evento sin fines de lucro, abierto al público y gratuito. A nivel global se celebra el mismo día, 21 de noviembre, en más de 70 ciudades de todo el mundo.

      Como Universidad Técnica Particular de Loja a través de la iniciativa "Realidad X UTPL" nos unimos a esta celebración para fomentar el conocimiento, el uso y el aprendizaje acerca de las Realidades eXtendidas.
    boton:
      texto: Ver más
      url: /acerca-de/

  # 7 ── Resumen de la agenda (se genera desde paginas/agenda.yaml)
  - tipo: agenda_resumen
    id: agenda
    titulo: Agenda
    fuente: agenda                 # muestra los dos días con sus actividades principales
    destacar:                      # actividades que se resaltan en el resumen
      - Asamblea General RAIN Ecuador
      - Bootcamp de cocreación con tecnologías inmersivas
      - Conferencia magistral internacional
      - VRDay Talks y stands
      - Premiación y foto oficial
      - Circuito Ciencia y Arte
    boton:
      texto: Ver agenda completa
      url: /agenda/

  # 8 ── Sede organizadora y aliados (afiche 2026)
  - tipo: aliados
    id: aliados
    fuente: evento
    titulo_sede: "Sede organizadora:"
    titulo_aliados: "Aliados:"

  # 9 ── Memorias
  - tipo: cta
    id: memorias
    titulo: Revive el VR Day LATAM
    boton:
      texto: Ver memorias
      url: /memorias/              # índice con todas las ediciones
