- slug: jorge-bacca-acosta
  nombre: Jorge Bacca Acosta
  edicion: 2023
  pais: Colombia
  institucion: ''
  foto: ponentes/2023/jorge-bacca-acosta.webp
  resena: |-
    Doctor en tecnología , Magister en Informática Industrial e Ingeniero en Telemática.

    Es actualmente profesor asociado de la Fundación Universitaria Konrad Lorenz de Colombia. Es doctor en tecnología por la Universitat de Girona (España) con mención Cum Laude, Magister en Informática Industrial por la misma universidad e Ingeniero en Telemática de la Universidad Distrital Francisco José de Caldas. Sus intereses de investigación son: Realidad Virtual y Aumentada en educación, técnicas de movimiento ocular en investigación, Tecnologías Educativas, Personalización, Adaptación, agentes inteligentes y web semántica. Dirige el capítulo para Colombia de la Immersive Learning Research Network – una red de investigación internacional dedicada a promover la investigación con tecnologías inmersivas en la educación. Es uno de los editores en jefe de la revista Contemporary Educational Technology y editor asociado de la revista Computer Applications in Engineering Education.
  visible_en_sitio_actual: true
  orden: 7
