  nombre: Fabian Bonilla
  edicion: 2023
  pais: Colombia
  institucion: ''
  foto: ponentes/2023/fabian-bonilla.webp
  resena: |-
    Artista plástico y realizador audiovisual con énfasis en nuevos medios.

    Durante su trayectoria, ha explorado diversas técnicas artísticas, abarcando desde el dibujo y la pintura hasta la animación, el video y el cine experimental y numerosos proyectos audiovisuales para televisión. Esta amplia gama de habilidades le ha permitido sumergirse en proyectos creativos multifacéticos. Su enfoque principal radica en la creación de narrativas transmedia, donde fusiona sus intereses visuales con la innovación en la narración audiovisual. Esta convergencia se ha convertido en la base de su trabajo artístico, permitiéndole explorar las posibilidades de la tecnología y el arte en conjunto. email: fabianbonillart@gmail.com
  visible_en_sitio_actual: true
  orden: 4
