- slug: sergio-ramirez
  nombre: Sergio Ramírez
  edicion: 2023
  pais: Colombia
  institucion: ''
  foto: ponentes/2023/sergio-ramirez.webp
  resena: |-
    Transeúnte de lo analógico a lo digital, es polivalente, emprendedor, innovador, formador, ubicuo y en múltiples realidades.

    Ha desarrollado una intensa actividad en el ámbito del derecho, en la aplicación de la inmersión, las tecnologías de la información, las telecomunicaciones, los medios digitales y creativos y, sobre todo, en la virtualidad extendida aplicada a la educación, la formación, la cultura y el entretenimiento, la salud, la industria, la seguridad, el marketing y el impacto social; tanto en España, Canadá, Estados Unidos, Reino Unido, México, Chile, Colombia y otros países latinoamericanos.

    Con sus más de 25 años de experiencia, es considerado uno de los pioneros de realidad virtual y aumentada en América Latina, actualmente es CEO y fundador de Demiurgo (www.demiurgo.xyz), abogado por la Universidad Nacional Autónoma de México; Humanista Digital por la Universidad Autónoma de Barcelona; Pedagogo por la UTEL; Miembro de XR LATAM; Miembro del Clúster Multimedia de Tecnologías Inmersivas; Miembro del Instituto Mexicano de Realidades Mixtas; Miembro de la Fundación Exponencial Latinoamericana; Miembro del Sistema Nacional de Competencias en México y ha dirigido empresas internacionales relacionadas con la producción de televisión, la animación, experiencias inmersivas, realidad virtual, realidad aumentada, realidad mixta y metaversos.
