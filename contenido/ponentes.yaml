- slug: maria-elisa-flores
  nombre: María Elisa Flores
  edicion: 2020
  pais: ''
  institucion: Soyarteecuador
  foto: ponentes/2020/maria-elisa-flores.webp
  resena: |-
    Máster en crítica de arte por la Universidad Nacional de las Artes (Buenos Aires-Argentina). Especialista en producción de textos críticos y de difusión mediática de las artes. Licenciada en restauración de obras de arte y museología por la Universidad Tecnológica Equinoccial (Quito-Ecuador). Curadora, crítica de arte y perito valuador certificada en bellas artes. Ha trabajado por más de diez años en conservación y restauración de bienes muebles e inmuebles mediante proyectos de rescate y salvaguarda del patrimonio cultural del Ecuador. Actualmente se desempeña como redactora freelance en revistas culturales. Redacción de reseñas artísticas y críticas de arte en prensa escrita. Producción de textos para catálogos y dossiers de artistas. Es asesora y promotora cultural independiente. Técnica en conservación y gestión del patrimonio cultural. Brinda consultorías para el desarrollo de colecciones privadas y corporativas. Realiza inventario y catalogación de colecciones públicas y privadas; peritajes, investigación histórica y avalúos de obras de arte. Participa activamente en congresos, seminarios, cursos y otros encuentros nacionales e internacionales de arte-cultura y museos desde hace más de una década.
  visible_en_sitio_actual: true
  orden: 7
