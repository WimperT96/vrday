<div class="contenedor banda">
  <div class="banda__texto">
    <h2 class="banda__titulo">{{ s.titulo|md_linea }}</h2>
    {% if s.subtitulo %}<p class="banda__subtitulo">{{ s.subtitulo }}</p>{% endif %}
  </div>
  {% if s.imagen %}<div class="banda__imagen">{% img s.imagen "" %}</div>{% endif %}
</div>
